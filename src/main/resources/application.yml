spring:
  application:
    name: lead-crm

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leadcrm}
    username: ${DB_USERNAME:leadcrm}
    password: ${DB_PASSWORD:leadcrm}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  admin:
    email: ${ADMIN_EMAIL:admin@glowuprizz.com}
    password: ${ADMIN_PASSWORD:admin1234}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8081}
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:8080}

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: admin
server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: publicform
  # 공개 폼 서버에는 관리자 인증이 없다. UserDetailsService 빈이 없을 때 스프링 부트가
  # 자동 생성하는 기본 인메모리 계정(로그에 "Using generated security password")을 막기 위해
  # 해당 auto-configuration을 publicform 프로파일에서만 제외한다. admin 프로파일에는 영향 없음.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server:
  port: 8081