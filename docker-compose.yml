services:
  db:
    image: postgres:16
    container_name: leadcrm-db
    environment:
      POSTGRES_DB: leadcrm
      POSTGRES_USER: leadcrm
      POSTGRES_PASSWORD: leadcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcrm"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: