<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>무료 전자책 신청</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    input { display: block; width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #333; color: #fff; border: 0; }
  </style>
</head>
<body>
  <h1>다이어트 전자책 무료 배포</h1>
  <p>이메일을 남겨주시면 바로 보내드립니다.</p>
  <form>
    <input type="text"  name="name"  placeholder="이름" required>
    <input type="email" name="email" placeholder="이메일" required>
    <input type="tel"   name="phone" placeholder="연락처">
    <button type="submit">신청하기</button>
  </form>
</body>
</html>
